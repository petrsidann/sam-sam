name: 24/7 Autonomous Agent

on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours automatically
  workflow_dispatch: # Allows you to trigger it manually with one click

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install openai

      - name: Run Agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python agent.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "Autonomous Agent"
          git config --global user.name "agent@workflow.ai"
          git add trends.md
          git commit -m "Auto-update trends from AI agent" || exit 0
          git push
